name: Crestet Unit Tests

on: [push, pull_request]

jobs:
  run-tests:
    runs-on: ubuntu-latest
  
    steps:
    - name: check out repository
      uses: actions/checkout@v4

    - name: set up python
      uses: actions/checkout@v4
      with:
        python-version: '3.10'
    
    - name: install dependencies
      run: pip install -r requirements.txt
    
    - name: run tests
      run: python tests.py